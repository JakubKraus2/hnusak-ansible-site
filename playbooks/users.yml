---
- name: Users
  hosts: dain
  become: true

  tasks:
    - name: Definice uzivatele
      ansible.builtin.user:
        name: "{{ user_name }}"
        state: present
        update_password: on_create

    - name: Autorizovane SSH klice
      ansible.posix.authorized_key:
        user: "{{ user_name }}"
        state: present
        key: "{{ user_ssh_keys | join('\n') }}"
        exclusive: true
